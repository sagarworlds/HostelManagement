name: CI (Linux)

# Everything that does not need Windows, on a Linux runner: static checks, a compile of all C# against the
# .NET Framework 4.8 reference assemblies, unit tests, the database tests against a real SQL Server (a service
# container that lives only for this job), the browser test of the grid script, and end-to-end tests of the real pages.
# The Windows-only checks live in scripts/build-windows.ps1 (see windows-build.yml for the manual workflow).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Pinned (not ubuntu-latest): the end-to-end tests need Mono's FastCGI server, which newer Ubuntu releases no longer
    # package (ubuntu-latest has moved to 26.04, where `mono-fastcgi-server4` does not exist).
    runs-on: ubuntu-24.04

    # The password protects nothing: the server exists for this job only and is reachable only from it. SQL Server
    # insists on a "complex" password, which is why it is not something simpler.
    env:
      HOSTELHUB_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci-Only-Passw0rd-Throwaway;TrustServerCertificate=True;Encrypt=False"

    services:
      sqlserver:
        # Same pinned version as tests/start-sql-server.sh.
        image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Only-Passw0rd-Throwaway"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        # The steps below start only once this succeeds, so the tests never race the server's start-up.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the browser used by the grid-search test
        run: cd tests/js && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      # The end-to-end tests run the real pages in a browser on Mono behind nginx (tests/e2e/stage_site.py says what that
      # covers and what it cannot).
      - name: Install Mono and nginx for the end-to-end tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-complete mono-fastcgi-server4 nginx

      - name: Run all Linux checks
        run: tests/run-local.sh --require-all
