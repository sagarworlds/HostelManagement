name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore HostelManagement.sln

      # The real connectionStrings.config is git-ignored; CI uses the committed template.
      - name: Create local connection string file
        run: |
          if (Test-Path HostelManagement/connectionStrings.config.example) {
            Copy-Item HostelManagement/connectionStrings.config.example HostelManagement/connectionStrings.config
          }

      - name: Build
        run: msbuild HostelManagement.sln /p:Configuration=Release /m /v:minimal

      # MSBuild only compiles code-behind. aspnet_compiler also compiles the .aspx/.master/.ascx
      # markup, which catches broken markup and designer/markup mismatches before runtime.
      - name: Compile ASPX markup
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\aspnet_compiler.exe" -v / -p HostelManagement -f -errorstack "$env:RUNNER_TEMP\precompiled"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
